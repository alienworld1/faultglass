[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faultglass-investigator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1", "fastapi==0.143.1", "uvicorn==0.54.0", "docker==7.2.0", "falkordb==1.8.0", "Pygments==2.21.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.setuptools]
packages = ["faultglass"]

[tool.setuptools.package-data]
faultglass = ["engine-matrix.json", "engine-verification.json", "queries/*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires the approved local engine images and Docker", "context: requires the persistent context service and approved local images"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "SIM"]
