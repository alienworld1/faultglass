user www-data;
worker_processes 1;
pid /run/faultglass-nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    map $request_method $command_source {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $command_source zone=commands:1m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=sources:1m;
    server {
        listen 127.0.0.1:8080;
        server_name 127.0.0.1 localhost;
        root /opt/faultglass/apps/web/dist;
        client_max_body_size 327680;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 15s;
        send_timeout 15s;
        limit_conn sources 64;
        limit_conn_status 429;
        limit_req zone=commands burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @busy;
        location @busy {
            default_type application/json;
            add_header Retry-After 10 always;
            return 429 '{"error":{"code":"workspace_busy","message":"The workspace is busy. Try again shortly.","retryable":true}}';
        }
        location = /api { return 404; }
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            proxy_send_timeout 15s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
